<script>
/* Page burn: when a page arrives through a page transition, varies where the burning line's
   pattern starts and plays a short crackle (made here with Web Audio, no sound file).
   The burn itself is CSS; see "Motion" in chronicle.css. */
(function () {
  window.chronicleSoundOn = function () {
    try { return localStorage.getItem('chronicle-sound') !== 'off'; } catch (e) { return true; }
  };
  window.chronicleCrackle = function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ac = new AC(), started = false;
    setTimeout(function () { if (!started) ac.close(); }, 400); // browser refused sound
    ac.resume().then(function () {
      started = true;
      var t0 = ac.currentTime + 0.02, sr = ac.sampleRate;
      var buf = ac.createBuffer(1, Math.floor(sr * 1.4), sr), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      var out = ac.createGain();
      out.gain.value = 0.3;
      out.connect(ac.destination);
      // the flame catching: low noise that swells and dies away
      var n = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
      n.buffer = buf; lp.type = 'lowpass';
      lp.frequency.setValueAtTime(250, t0);
      lp.frequency.exponentialRampToValueAtTime(1500, t0 + 0.45);
      lp.frequency.exponentialRampToValueAtTime(450, t0 + 1.2);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.6, t0 + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.25);
      n.connect(lp).connect(g).connect(out);
      n.start(t0); n.stop(t0 + 1.3);
      // crackles: short bright pops, thickening as the fire spreads
      for (var k = 0; k < 36; k++) {
        var at = t0 + Math.pow(Math.random(), 0.7) * 1.0, len = 0.004 + Math.random() * 0.018;
        var c = ac.createBufferSource(), bp = ac.createBiquadFilter(), cg = ac.createGain();
        c.buffer = buf; bp.type = 'bandpass';
        bp.frequency.value = 1200 + Math.random() * 4200;
        bp.Q.value = 0.8 + Math.random() * 2;
        cg.gain.setValueAtTime(0.2 + Math.random() * 0.8, at);
        cg.gain.exponentialRampToValueAtTime(0.0001, at + len);
        c.connect(bp).connect(cg).connect(out);
        c.start(at, Math.random() * 1.2, len + 0.01);
      }
      setTimeout(function () { ac.close(); }, 1800);
    });
  };
  addEventListener('pagereveal', function (e) {
    if (!e.viewTransition) return;
    // start the ragged line at a different point each time, so it never looks the same twice
    document.documentElement.style.setProperty('--burn-shift', Math.round(Math.random() * -1024) + 'px');
    if (window.chronicleSoundOn()) window.chronicleCrackle();
  });
})();
</script>
