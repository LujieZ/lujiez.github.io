<title id="kl-wide-t">A key's life, before and after</title><desc id="kl-wide-d">Before 2021, a key went from Created to Active, and the only way out was Deleted, which could not be undone: there was no off switch. After: a key goes from Created to Active, can be disabled and re-enabled, and is deleted only once nothing depends on it. When a leak is detected, the key is disabled automatically. This is on by default.</desc>
