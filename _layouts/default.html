<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {%- else %}
  <title>{{ site.title }} · Sue Zhao</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#E9DBBC">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Fredericka+the+Great&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/chronicle.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to the stories</a>
  {% include ink/ink-filter.svg %}
  <div class="grain" aria-hidden="true"></div>

  <div class="wrap">
    {% include masthead.html %}
  </div>

  <main id="main">
    {{ content }}
  </main>

  {% include colophon.html %}
  <script src="{{ '/assets/js/chronicle.js' | relative_url }}" defer></script>
</body>
</html>
